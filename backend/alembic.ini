# Alembic de Gestion MP PRO (MODELE-DONNEES § 9). L'adresse de la base ne s'écrit pas ici :
# elle vient de `-x base=…`, sinon de GESTIONMPPRO_BASE (config.Reglages), sinon, pour la seule
# commande `alembic check` (make verifier), de la base d'essai ci-dessous, migrée par pytest.

[alembic]
script_location = %(here)s/gestion_mp_pro/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

[post_write_hooks]
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = %(here)s/.venv/bin/ruff
ruff_check.options = check --fix-only REVISION_SCRIPT_FILENAME

[gestion_mp_pro]
base_de_controle = postgresql+psycopg:///gestion_mp_pro_essai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
